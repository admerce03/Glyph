name: CI

on:
  push:
    branches: [main, cursor/**]
  pull_request:
    branches: [main]

concurrency:
  # Same branch push + PR share a group so Windows runners are not double-queued.
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Artifact download smoke needs actions:read; contents for checkout.
permissions:
  contents: read
  actions: read

jobs:
  windows:
    name: Windows build & test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ./Glyph.sln

      - name: Build
        run: ./scripts/build.ps1 -Configuration Release
        shell: pwsh

      - name: Test
        run: ./scripts/test.ps1 -Configuration Release
        shell: pwsh

      - name: Format verify
        run: ./scripts/format.ps1 -Verify
        shell: pwsh

      - name: MSIX publish smoke (test-signed)
        run: ./scripts/publish-msix.ps1 -Configuration Release -Runtime win-x64 -TestSign
        shell: pwsh

      - name: Enable MSIX sideloading (CI)
        run: |
          $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
          if (-not (Test-Path -LiteralPath $path)) {
            New-Item -Path $path -Force | Out-Null
          }
          New-ItemProperty -Path $path -Name AllowDevelopmentWithoutDevLicense -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $path -Name AllowAllTrustedApps -PropertyType DWord -Value 1 -Force | Out-Null
          Write-Host 'AppModelUnlock sideloading policy enabled for CI runner.'
        shell: pwsh

      - name: MSIX sideload + association probe
        run: ./scripts/install-msix-test.ps1 -PackageDir artifacts/msix -Force -ProbeUserDefaults
        shell: pwsh

      - name: Upload MSIX layout
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: glyph-msix-layout
          path: artifacts/msix/
          if-no-files-found: warn
          retention-days: 5

      - name: MSIX publish smoke (test-signed win-arm64)
        run: ./scripts/publish-msix.ps1 -Configuration Release -Runtime win-arm64 -TestSign -Output artifacts/msix-arm64
        shell: pwsh

      - name: Upload MSIX layout (win-arm64)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: glyph-msix-layout-arm64
          path: artifacts/msix-arm64/
          if-no-files-found: warn
          retention-days: 5

  core-linux:
    name: Core libraries on Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build core
        run: ./scripts/build.sh --core-only --configuration Release

      - name: Test core
        run: ./scripts/test.sh --core-only --configuration Release

      - name: Interactive verify status (proof kit)
        run: |
          set +e
          pwsh ./scripts/interactive-verify.ps1 -StatusOnly
          code=$?
          set -e
          # Exit 0 = all expected captures present; 2 = some missing (normal until Windows interactive).
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            echo "Unexpected interactive-verify -StatusOnly exit: $code" >&2
            exit "$code"
          fi
          echo "interactive-verify -StatusOnly exit=$code (0=complete, 2=captures pending)"

      # Regression guard for #141: gh run download has no --branch; orchestrator must
      # resolve a successful main run id and fetch glyph-msix-layout (+ cert).
      - name: Interactive verify DownloadArtifact smoke
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          pwsh ./scripts/interactive-verify.ps1 -DownloadArtifact -PackageDir artifacts/msix-ci-smoke
          test -f artifacts/msix-ci-smoke/Glyph.CI.TestSign.cer
          find artifacts/msix-ci-smoke -name 'Glyph.App_*.msix' | grep -q .
          echo "DownloadArtifact smoke OK"
