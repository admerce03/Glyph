name: CI

on:
  push:
    branches: [main, cursor/**]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build & test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ./Glyph.sln

      - name: Build
        run: ./scripts/build.ps1 -Configuration Release
        shell: pwsh

      - name: Test
        run: ./scripts/test.ps1 -Configuration Release
        shell: pwsh

      - name: Format verify
        run: ./scripts/format.ps1 -Verify
        shell: pwsh

      - name: MSIX publish smoke (unsigned)
        continue-on-error: true
        run: ./scripts/publish-msix.ps1 -Configuration Release -Runtime win-x64
        shell: pwsh

      - name: Upload MSIX layout
        if: success() || failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: glyph-msix-layout
          path: artifacts/msix/
          if-no-files-found: ignore
          retention-days: 5

  core-linux:
    name: Core libraries on Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build core
        run: ./scripts/build.sh --core-only --configuration Release

      - name: Test core
        run: ./scripts/test.sh --core-only --configuration Release
